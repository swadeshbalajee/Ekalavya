<text x="52.0" y="324.0" font-size="14" font-weight="600" fill="#064e3b" >web (nginx, :8080)</text>
<circle cx="55.0" cy="342.0" r="1.8" fill="#64748b"/>
<text x="62.0" y="346.0" font-size="12" fill="#334155" >serves the built app</text>
<circle cx="55.0" cy="358.0" r="1.8" fill="#64748b"/>
<text x="62.0" y="362.0" font-size="12" fill="#334155" >/api → api:8000, looked up on every</text>
<text x="62.0" y="378.0" font-size="12" fill="#334155" >request so an API restart never leaves a</text>
<text x="62.0" y="394.0" font-size="12" fill="#334155" >stale address</text>
