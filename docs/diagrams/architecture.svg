<text x="432.0" y="376.5" font-size="13" font-weight="600" fill="#064e3b" >Videos</text>
<circle cx="435.0" cy="394.0" r="1.8" fill="#64748b"/>
<text x="442.0" y="398.0" font-size="11.5" fill="#334155" >builds, edits, versions, progress, media streaming</text>
