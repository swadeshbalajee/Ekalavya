<rect width="1820" height="950" fill="#ffffff"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">Ekalavya system architecture</text>
<text x="40" y="70" font-size="13.5" fill="#475569">Docker Compose services and what each one owns. The detailed flows are in the other diagrams in docs/diagrams/.</text>
