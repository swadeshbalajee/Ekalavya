<text x="62.0" y="158.0" font-size="12" fill="#334155" >React + Vite single-page app</text>
<circle cx="55.0" cy="170.0" r="1.8" fill="#64748b"/>
<text x="62.0" y="174.0" font-size="12" fill="#334155" >Home · Chat · Watch · Discover · Library</text>
<circle cx="55.0" cy="186.0" r="1.8" fill="#64748b"/>
<text x="62.0" y="190.0" font-size="12" fill="#334155" >Study plan · Quiz · Knowledge map · Usage</text>
<circle cx="55.0" cy="202.0" r="1.8" fill="#64748b"/>
<text x="62.0" y="206.0" font-size="12" fill="#334155" >Settings: languages, voice, research</text>
<text x="62.0" y="222.0" font-size="12" fill="#334155" >depth</text>
