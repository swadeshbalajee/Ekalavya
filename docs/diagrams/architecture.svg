<text x="902.0" y="158.0" font-size="12" fill="#334155" >BuildVideoWorkflow · EditProjectWorkflow</text>
<circle cx="895.0" cy="170.0" r="1.8" fill="#64748b"/>
<text x="902.0" y="174.0" font-size="12" fill="#334155" >LocalizeProjectWorkflow</text>
<circle cx="895.0" cy="186.0" r="1.8" fill="#64748b"/>
<text x="902.0" y="190.0" font-size="12" fill="#334155" >QdrantReconciliationWorkflow (hourly)</text>
<circle cx="895.0" cy="202.0" r="1.8" fill="#64748b"/>
<text x="902.0" y="206.0" font-size="12" fill="#334155" >durable, cancellable; a failed rebuild restores the last</text>
<text x="902.0" y="222.0" font-size="12" fill="#334155" >good video</text>
