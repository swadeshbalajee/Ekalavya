[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarmotion"
version = "0.1.0"
description = "Artifact-driven narrated Manim lesson production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.26",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "qdrant-client>=1.12",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.32",
  "streamlit>=1.38",
  "sympy>=1.13",
  "temporalio>=1.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34", "google-genai>=1.0", "openai>=1.45"]
embeddings = ["sentence-transformers>=3.0"]
# Local forced alignment of narration (torch + transformers come with embeddings).
alignment = ["sentence-transformers>=3.0", "uroman>=1.3", "scipy>=1.11"]
s3 = ["boto3>=1.35"]
manim = ["manim>=0.18"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "testcontainers[postgres]>=4.9"]
observability = [
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.scripts]
scholarmotion-api = "scholarmotion.api.main:run"
scholarmotion-reconcile-qdrant = "scholarmotion.workflows.reconcile_qdrant:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarmotion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["media: requires ffmpeg/manim", "integration: integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
