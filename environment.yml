name: scholarmotion
channels:
  - conda-forge
dependencies:
  # Manim 0.18 supports Python through 3.11.
  - python=3.11
  - pip
  - ffmpeg
  - cairo
  - pango
  - manim
  - postgresql
  - pip:
      - -e .[dev,llm,embeddings,alignment]
      # spaCy's small English model, used to find names and numbers before translation.
      - en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
